# Пример обратного прокси для TANgle / Reverse proxy example for TANgle
map $http_x_forwarded_for $real_ip {
    default $remote_addr;
    "~^(?P<ip>[^,]+)" $ip;
}

server {
    listen 80;
    server_name _;

    # Не сжимать ответы: Televizo и okhttp не умеют читать gzip
    # Don't compress: Televizo and okhttp can't read gzip responses
    gzip off;

    location / {
        proxy_pass http://tangle:9239;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
}
