services:
  tangle:
    build: .
    image: tangle:latest
    container_name: tangle
    environment:
      - PYTHONUNBUFFERED=1
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:9239}
      - EPG_DAYS=${EPG_DAYS:-7}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    volumes:
      - ./data:/data
      - ./playlist:/playlist
    ports:
      - "${TANGLE_PORT:-9239}:9239"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9239/api/check_login"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
