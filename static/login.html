<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANgle — Вход</title>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'auto')}catch(e){}</script>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        body{display:flex;align-items:center;justify-content:center;padding:24px 16px}
        .login{width:380px;max-width:100%;text-align:center}
        .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 20px}
        h1{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em}
        .sub{color:var(--text-2);font-size:15px;margin:6px 0 28px}
        .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;text-align:left;box-shadow:var(--shadow-sm)}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
        .form-group input{width:100%;padding:11px 14px;font-size:15px}
        .btn{width:100%;padding:11px;font-size:15px;margin-top:6px}
        .error{background:var(--accent-soft);color:var(--red);padding:10px 12px;border-radius:var(--r-md);margin-bottom:14px;font-size:14px;display:none}
        .lang-switch{position:fixed;top:16px;right:16px;display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:10px}
        .lang-btn{background:transparent;border:0;color:var(--text-2);padding:5px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
        .lang-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
    </style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn" data-lang="en" onclick="setLoginLang('en')">EN</button>
        <button class="lang-btn" data-lang="ru" onclick="setLoginLang('ru')">RU</button>
    </div>
    <main class="login">
        <div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M8 2.5l4 3.5 4-3.5"/></svg></div>
        <h1>TANgle</h1>
        <p class="sub" id="sub">IPTV Checker</p>
        <div class="box">
            <div class="error" id="error-msg"></div>
            <form onsubmit="doLogin(event)">
                <div class="form-group">
                    <label id="lbl-login" for="login">Login</label>
                    <input type="text" id="login" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label id="lbl-password" for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-submit">Sign in</button>
            </form>
        </div>
    </main>
    <script>
    const loginTranslations = {
        ru: { login: 'Логин', password: 'Пароль', submit: 'Войти', error: 'Неверный логин или пароль', sub: 'Управление IPTV-плейлистами' },
        en: { login: 'Login', password: 'Password', submit: 'Sign in', error: 'Invalid login or password', sub: 'IPTV playlist manager' }
    };
    function setLoginLang(lang) {
        try { localStorage.setItem('lang', lang); } catch (e) {}
        const tr = loginTranslations[lang];
        document.documentElement.lang = lang;
        document.getElementById('lbl-login').textContent = tr.login;
        document.getElementById('lbl-password').textContent = tr.password;
        document.getElementById('btn-submit').textContent = tr.submit;
        document.getElementById('error-msg').textContent = tr.error;
        document.getElementById('sub').textContent = tr.sub;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    let savedLang = 'en';
    try { savedLang = localStorage.getItem('lang') || 'en'; } catch (e) {}
    setLoginLang(savedLang);
    async function doLogin(e) {
        e.preventDefault();
        const err = document.getElementById('error-msg');
        const btn = document.getElementById('btn-submit');
        err.style.display = 'none';
        btn.disabled = true;
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    login: document.getElementById('login').value,
                    password: document.getElementById('password').value
                })
            });
            if (res.ok) { window.location.href = '/'; return; }
            err.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
